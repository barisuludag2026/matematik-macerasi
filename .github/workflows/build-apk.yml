name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.34

      - name: Prepare Buildozer Android SDK
        run: |
          rm -rf ~/.buildozer/android/platform/android-sdk

          mkdir -p ~/.buildozer/android/platform/android-sdk

      - name: Initialize Buildozer
        run: |
          buildozer android debug || true

      - name: Accept Android licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          if [ -f "$ANDROID_HOME/licenses/android-sdk-license" ]; then
            mkdir -p "$SDK/licenses"
            cp -r "$ANDROID_HOME/licenses/"* "$SDK/licenses/"
          fi

          yes | "$SDK/tools/bin/sdkmanager" --licenses || true

      - name: Install required Android Build Tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: matematik-macerasi-apk
          path: bin/*.apk
