name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.34

      - name: Initialize Android SDK
        run: |
          buildozer android debug || true

      - name: Find Android SDK tools
        run: |
          echo "Android SDK contents:"
          find "$HOME/.buildozer/android/platform/android-sdk" -name sdkmanager -type f -print

      - name: Accept Android licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER=$(find "$SDK" -name sdkmanager -type f | head -n 1)

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android Build Tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER=$(find "$SDK" -name sdkmanager -type f | head -n 1)

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;37.0.0"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: matematik-macerasi-apk
          path: bin/*.apk
